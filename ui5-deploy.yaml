# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.bmi.orderquotematch.project1
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: BD4_300_HTTP
          url: http://bd4.sap.bmigroup.com:8001
          client: '300'
        app:
          name: ZQUOTETOORDER
          description: Quote To Order Fiori Application
          package: ZOTC
          transport: BD4K981944
        exclude:
          - /test/
          - /localService/
